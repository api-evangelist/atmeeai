name: Atmee.ai
description: 'Atmee.ai is a consumer platform for creating and video-calling AI avatars and personas,
  made by Atmanity (founded 2024). Anyone can build custom AI avatars or browse thousands of
  community-created personas across comedy, companion, productivity, and lifestyle categories, then hold
  real-time voice and video conversations with them. The platform includes identity verification with a
  Verified badge, a creator monetization program that pays people when others talk to their persona, and
  LoRAvatar, an adaptation method that personalizes avatars while preserving identity-specific details
  like wrinkles, tattoos, and facial textures. A developer API is documented as "coming soon"; today
  Atmee is a finished consumer product rather than a developer toolkit. Backed by Forerunner Ventures.'
